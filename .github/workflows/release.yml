name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - uses: mlugg/setup-zig@v2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS has no static libc and Apple's SDK is needed to link, so darwin is
  # built natively here, with Tree-sitter, and added to GoReleaser's release.
  darwin:
    needs: goreleaser
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Build and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          mkdir -p dist
          gh release download "$TAG" -p checksums.txt -D dist
          for arch in amd64 arm64; do
            name=cephalote_${version}_darwin_${arch}
            mkdir -p "dist/$name"
            CGO_ENABLED=1 GOOS=darwin GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$version" \
              -o "dist/$name/cephalote" ./cmd/cephalote
            cp LICENSE README.md cephalote.example.yaml "dist/$name/"
            tar -C "dist/$name" -czf "dist/$name.tar.gz" .
            (cd dist && shasum -a 256 "$name.tar.gz" >> checksums.txt)
          done
          dist/cephalote_${version}_darwin_arm64/cephalote --version | grep -q '(tree-sitter)'
          gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --clobber
