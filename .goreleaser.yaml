version: 2

project_name: cephalote

before:
  hooks:
    - go mod tidy

builds:
  - id: cephalote
    main: ./cmd/cephalote
    binary: cephalote
    # Tree-sitter is C, so this is a cgo build, linked statically against
    # musl with zig as the C toolchain: one file, no runtime dependencies,
    # and the full analyzer. macOS cannot be linked statically and needs
    # Apple's SDK, so the darwin binaries are built on a macOS runner in
    # .github/workflows/release.yml and attached to the same release.
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
      - -linkmode external -extldflags '-static -s'
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CC=zig cc -target x86_64-linux-musl
          - CXX=zig c++ -target x86_64-linux-musl
      - goos: linux
        goarch: arm64
        env:
          - CC=zig cc -target aarch64-linux-musl
          - CXX=zig c++ -target aarch64-linux-musl

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - cephalote.example.yaml

checksum:
  name_template: checksums.txt
  algorithm: sha256

nfpms:
  - id: packages
    package_name: cephalote
    maintainer: Smiduweorc
    description: Scan source code for weak cryptographic schemes.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin

source:
  enabled: true

release:
  github:
    owner: Smiduweorc
    name: Cephalote
  draft: false
  prerelease: auto

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
